name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["8", "17"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install bundled Maven dependencies
        working-directory: lib
        run: bash ./install.sh

      - name: Run full sync safety tests
        run: mvn -B -Dmaven.test.skip=false -Dmaven.javadoc.skip=true -Dtest=FullSyncSafetyTest -DfailIfNoTests=false -pl manager/biz -am test

      - name: Run full sync web confirmation tests
        run: mvn -B -Dmaven.test.skip=false -Dmaven.javadoc.skip=true -Dtest=FullSyncActionTest -DfailIfNoTests=false -pl manager/web -am test

      - name: Run reverse proxy redirect tests
        run: mvn -B -Dmaven.test.skip=false -Dmaven.javadoc.skip=true -Dtest=RelativeRedirectConfigTest -DfailIfNoTests=false -pl manager/deployer -am test

  build-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install bundled Maven dependencies
        working-directory: lib
        run: bash ./install.sh

      - name: Build release packages
        run: mvn -B -DskipTests -Dmaven.javadoc.skip=true -Denv=release clean package

      - name: List release packages
        run: ls -lh target/*.tar.gz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" target/*.tar.gz \
            --title "$TAG_NAME" \
            --notes "Automated Otter release built by GitHub Actions."
